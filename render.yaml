# Blueprint de Render: portal + base PostgreSQL + disco para archivos subidos.
# En Render: New > Blueprint > repo richbello/portal-copropiedad > Apply.
services:
  - type: web
    name: portal-avellana
    runtime: docker
    plan: starter            # plan pago básico: no se duerme y permite disco persistente
    region: oregon
    branch: main
    autoDeploy: true         # cada git push a main redespliega solo
    healthCheckPath: /api/salud
    disk:
      name: archivos
      mountPath: /data       # UPLOAD_DIR=/data/uploads (definido en el Dockerfile)
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portal-avellana-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NOMBRE_CONJUNTO
        value: Conjunto Avellana Ciudad Verde
      - key: NIT_CONJUNTO
        value: 900.000.000-0
      - key: CORS_ORIGINS
        value: https://portal-avellana.onrender.com
      - key: TOKEN_MINUTOS
        value: "480"

  # Portal de DEMOSTRACIÓN para administradores de otros conjuntos: datos ficticios,
  # acceso solo con licencia de prueba. Plan gratuito: se duerme sin uso y al despertar
  # vuelve a cargar los datos ficticios (la demostración se restablece sola).
  # Nunca apunta a la base real de Avellana.
  - type: web
    name: portal-demo-verde360
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/salud
    envVars:
      - key: MODO_DEMO
        value: "1"
      - key: CLAVE_MAESTRA      # la ve en Render > portal-demo-verde360 > Environment
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: NOMBRE_CONJUNTO
        value: Conjunto Demostración Verde360
      - key: CORS_ORIGINS
        value: https://portal-demo-verde360.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: DIAS_LICENCIA
        value: "15"
      - key: WHATSAPP_VENTAS
        value: "573208303847"

databases:
  - name: portal-avellana-db
    plan: basic-256mb
    region: oregon
    databaseName: copropiedad
    user: copropiedad
